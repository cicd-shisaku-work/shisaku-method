# Tests and a full build of the public site (src/site/DESIGN.md §17).
# It never deploys: no AWS credentials, no secrets, and no deployment values.
name: site

on:
  push:
    paths:
      - "src/site/**"
      - "concepts/**"
      - "README.md"
      - ".github/workflows/site.yml"
  pull_request:
    paths:
      - "src/site/**"
      - "concepts/**"
      - "README.md"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install pinned dependencies
        run: python -m pip install -r src/site/requirements.txt
      - name: Fetch the share-card fonts (pinned commit, SHA-256 verified)
        run: python src/site/fetch_fonts.py --dest "$RUNNER_TEMP/fonts"
      - name: Unit tests
        run: SITE_FONTS="$RUNNER_TEMP/fonts" python -m unittest discover -s src/site/tests -t src/site -v
      - name: Build the site from this commit and run the quality gate
        env:
          SOURCE_REPO: ${{ github.repository }}
          SOURCE_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: python src/site/build_site.py --src . --out "$RUNNER_TEMP/dist" --fonts "$RUNNER_TEMP/fonts" --commit "$GITHUB_SHA" --report
