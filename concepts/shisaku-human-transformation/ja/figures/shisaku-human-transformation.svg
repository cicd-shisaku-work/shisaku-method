<?xml version="1.0" encoding="UTF-8"?>
<!--
  シサク・ヒト変容理論 (Shisaku Human Transformation Theory — SHTT)
  設計・監査用の図（人間向け）。学説は傍証であって証明ではない。生成非注入。
  統一様式 v1（四成分の固定色：軌跡=青／表現=緑／距離=紫／共鳴=teal／変容=橙）。
  Copyright (c) 2026 shisaku. Licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/).
  Author: https://note.com/abstraction
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#444"/></marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#c98a2a"/></marker>
    <marker id="arrowDash" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#8a95a0"/></marker>
    <style>
      .bg{fill:#ffffff}
      .title{fill:#111;font-weight:700}
      .sub{fill:#555}
      .foot{fill:#777;font-size:11px}
      .footR{fill:#777;font-size:11px;text-anchor:end}
      /* unified component palette */
      .c-traj{stroke:#3a6a8a;fill:#e9f1f7;stroke-width:1.5}
      .c-expr{stroke:#4a7a4a;fill:#eef5ee;stroke-width:1.5}
      .c-dist{stroke:#6a5a8a;fill:#efe9f4;stroke-width:1.5}
      .c-kyo{stroke:#2f7d7d;fill:#e3f1f1;stroke-width:1.5}
      .c-trans{stroke:#b07a3a;fill:#fbf3e8;stroke-width:1.6}
      .c-subj{stroke:#5b6b7a;fill:#f1f3f5;stroke-width:1.5}
      .c-prem{stroke:#7a8a99;fill:#f4f6f8;stroke-width:1.4}
      .c-eth{stroke:#9a7a5a;fill:#f7f2ec;stroke-width:1.4}
      .nlbl{fill:#1a2530;font-size:16px;text-anchor:middle;font-weight:700}
      .nsub{fill:#4a5a63;font-size:11px;text-anchor:middle}
      .ann{fill:#33414d;font-size:12px}
      .annC{fill:#33414d;font-size:11.5px;text-anchor:middle}
      .transh{fill:#8a5a1a;font-size:16px;font-weight:700}
      .transb{fill:#4a3a24;font-size:12.5px}
      .amber{fill:#9a7a3a}
      .flow{stroke:#444;stroke-width:1.7;fill:none}
      .fb{stroke:#c98a2a;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
      .dash{stroke:#8a95a0;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1080" height="660"/>

  <!-- Title -->
  <text class="title" x="540" y="40" font-size="25" text-anchor="middle">シサク・ヒト変容理論</text>
  <text class="sub" x="540" y="63" font-size="14" text-anchor="middle">Shisaku Human Transformation Theory — SHTT</text>
  <text class="sub" x="540" y="84" font-size="12.5" text-anchor="middle">四成分を統べる上位理論　／　変容＝残存＋累積が系全体の通し軸　／　上流依存＝前提優位理論</text>

  <!-- naming rule (top-right) -->
  <text class="footR" x="1040" y="112">略号：上位＝SHTT／成分＝SH＋頭字＋ST</text>
  <text class="footR" x="1040" y="127">軌跡 SHTST・表現 SHEST・距離 SHDST・共鳴 SHKST</text>

  <!-- Premise Primacy (upstream of 主体) -->
  <rect class="c-prem" x="44" y="104" width="176" height="44" rx="7"/>
  <text class="nlbl" x="132" y="126" font-size="13">前提優位（上流依存）</text>
  <text class="nsub" x="132" y="141" font-size="10">前提への介入をヒト種へ降ろした系</text>
  <path class="flow" d="M132,148 L132,176" marker-end="url(#arrow)"/>

  <!-- Pipeline row: 主体 → 軌跡 → 表現 → 距離 → 共鳴 -->
  <!-- 主体 -->
  <rect class="c-subj" x="44" y="176" width="176" height="76" rx="8"/>
  <text class="nlbl" x="132" y="203">主体</text>
  <text class="nsub" x="132" y="222">元手／クオリア発生／欲求</text>
  <text class="nsub" x="132" y="238" fill="#7a6a5a">＝上流・AI 代替不可</text>
  <!-- 軌跡 -->
  <rect class="c-traj" x="242" y="176" width="176" height="76" rx="8"/>
  <text class="nlbl" x="330" y="200">軌跡 <tspan font-size="12" fill="#3a6a8a">SHTST</tspan></text>
  <text class="nsub" x="330" y="220">何を体験させ何を変容させるか</text>
  <text class="nsub" x="330" y="236" fill="#3a6a8a">落差・予測配置</text>
  <!-- 表現 -->
  <rect class="c-expr" x="440" y="176" width="176" height="76" rx="8"/>
  <text class="nlbl" x="528" y="200">表現 <tspan font-size="12" fill="#4a7a4a">SHEST</tspan></text>
  <text class="nsub" x="528" y="220">どう実装するか</text>
  <text class="nsub" x="528" y="236" fill="#4a7a4a">基体×構成操作・元手依存</text>
  <!-- 距離 -->
  <rect class="c-dist" x="638" y="176" width="176" height="76" rx="8"/>
  <text class="nlbl" x="726" y="200">距離 <tspan font-size="12" fill="#6a5a8a">SHDST</tspan></text>
  <text class="nsub" x="726" y="220">何が届き何が届かないか</text>
  <text class="nsub" x="726" y="236" fill="#6a5a8a">多次元の距離・場</text>
  <!-- 共鳴 -->
  <rect class="c-kyo" x="836" y="176" width="176" height="76" rx="8"/>
  <text class="nlbl" x="924" y="200">共鳴 <tspan font-size="12" fill="#2f7d7d">SHKST</tspan></text>
  <text class="nsub" x="924" y="220">実際に何が鳴ったか</text>
  <text class="nsub" x="924" y="236" fill="#2f7d7d">受容・残存の機構</text>

  <!-- horizontal flow arrows -->
  <path class="flow" d="M220,214 L242,214" marker-end="url(#arrow)"/>
  <path class="flow" d="M418,214 L440,214" marker-end="url(#arrow)"/>
  <path class="flow" d="M616,214 L638,214" marker-end="url(#arrow)"/>
  <path class="flow" d="M814,214 L836,214" marker-end="url(#arrow)"/>

  <!-- connectors down into 変容 band -->
  <text class="annC" x="627" y="332" fill="#8a5a1a">四成分すべての共通の対象 → 変容（通し軸）</text>
  <path class="dash" d="M330,252 L330,344" marker-end="url(#arrowDash)"/>
  <path class="dash" d="M528,252 L528,344" marker-end="url(#arrowDash)"/>
  <path class="dash" d="M726,252 L726,344" marker-end="url(#arrowDash)"/>
  <path class="flow" d="M924,252 L924,344" marker-end="url(#arrow)"/>
  <text class="ann" x="932" y="300" font-size="11" fill="#2f7d7d">残存＝接触後に残る</text>

  <!-- 変容 band (through-axis) -->
  <rect class="c-trans" x="242" y="344" width="770" height="128" rx="10"/>
  <text class="transh" x="262" y="372">変容 ＝ 残存 ＋ 累積（四成分の通し軸）</text>
  <text class="transb" x="262" y="396">・接触で生じ、接触後にも残る内部状態の不可逆な差分＝残存（共鳴＝時間内／変容＝時間後）。</text>
  <text class="transb" x="262" y="418">・深さ＝差分が受け手のどの層まで及ぶか。前提の更新は「深い変容」の一形態にすぎない。</text>
  <text class="transb" x="262" y="440">・累積：点→線→面。加算でなく別構造 C へ結合・再編成＝未来の変容の材料（十年後の再結合も）。</text>
  <text class="transb" x="262" y="462" fill="#7a5a2a">・目標変容 ≠ 実際の変容——その差が評価・自己監査（しっくり感）の信号。狙う深さは設計選択。</text>

  <!-- feedback arc back to 主体 -->
  <path class="fb" d="M242,372 C150,372 132,320 132,254" marker-end="url(#arrowAmber)"/>
  <text class="amber" x="60" y="300" font-size="11">目標−実際の差</text>
  <text class="amber" x="60" y="315" font-size="11">→ 自己監査 → 較正</text>

  <!-- notes row -->
  <rect class="c-prem" x="44" y="488" width="480" height="56" rx="8"/>
  <text class="ann" x="58" y="508" font-weight="700" fill="#3a4a55">フィードバック系</text>
  <text class="ann" x="58" y="525" font-size="11.5">上流依存（逆算従属）を保ちつつ、実装・受容の再知覚が上流を書き換える。</text>
  <text class="ann" x="58" y="540" font-size="11.5">目標変容−実際の変容の差が、表現者自身の監査（しっくり感）の信号になる。</text>

  <rect class="c-prem" x="540" y="488" width="496" height="56" rx="8"/>
  <text class="ann" x="554" y="508" font-weight="700" fill="#3a4a55">予測誤差の二役（接合の候補・要検証）</text>
  <text class="ann" x="554" y="525" font-size="11.5">距離＝静的な量（前提のずれ）／軌跡・表現＝動的な原理（予測を</text>
  <text class="ann" x="554" y="540" font-size="11.5">持たせ・外し・回収）。両者を同一量と結ぶ保証はまだ無い。</text>

  <!-- Ethics band -->
  <rect class="c-eth" x="44" y="556" width="992" height="46" rx="8"/>
  <text class="ann" x="60" y="577" font-size="12.5" font-weight="700" fill="#7a5a3a">倫理＝操作構造の境界（四成分に共通・不可分）</text>
  <text class="ann" x="60" y="594" font-size="11.5">開示された誘導＝招待／隠して自己選択を奪う誘導＝操作。　透明性・自己選択・賞味期限・自己更新の不可侵（境界は動機でなく「開かれているか」で引く）。</text>

  <!-- Audit note + credit -->
  <text class="foot" x="44" y="624">接地は進化的（動物行動学・進化心理学・コストリー・シグナリング・予測符号化・記憶の再固定化・神経可塑性…）＝傍証であって証明でない。クオリア発生は哲学的原始項。設計・監査用（生成非注入）。</text>
  <text class="footR" x="1036" y="644">© 2026 shisaku ／ CC BY 4.0</text>
</svg>
