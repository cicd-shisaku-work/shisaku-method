<!--
  シサク・ヒト変容理論 (Shisaku Human Transformation Theory — SHTT) v0.2
  設計・監査用の図（人間向け）。学説は傍証であって証明ではない。生成非注入。
  統一様式 v1（四成分の固定色：軌跡=青／表現=緑／距離=紫／共鳴=teal／変容=橙／IDION=葡萄色／駆動=赤褐）。
  Copyright (c) 2026 shisaku. Licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/).
  Author: https://note.com/abstraction
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 800" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#444"/></marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#c98a2a"/></marker>
    <marker id="arrowDash" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#8a95a0"/></marker>
    <marker id="arrowIdion" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#6b2d3e"/></marker>
    <marker id="arrowKyo" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#2f7d7d"/></marker>
    <style>
      .bg{fill:#ffffff}
      .title{fill:#111;font-weight:700}
      .sub{fill:#555}
      .foot{fill:#777;font-size:11px}
      .footR{fill:#777;font-size:11px;text-anchor:end}
      .c-traj{stroke:#3a6a8a;fill:#e9f1f7;stroke-width:1.5}
      .c-expr{stroke:#4a7a4a;fill:#eef5ee;stroke-width:1.5}
      .c-dist{stroke:#6a5a8a;fill:#efe9f4;stroke-width:1.5}
      .c-kyo{stroke:#2f7d7d;fill:#e3f1f1;stroke-width:1.5}
      .c-trans{stroke:#b07a3a;fill:#fbf3e8;stroke-width:1.6}
      .c-idion{stroke:#6b2d3e;fill:#f5ecef;stroke-width:1.6}
      .c-drive{stroke:#a3472a;fill:#faf0ec;stroke-width:1.3}
      .c-prem{stroke:#7a8a99;fill:#f4f6f8;stroke-width:1.4}
      .c-eth{stroke:#9a7a5a;fill:#f7f2ec;stroke-width:1.4}
      .c-stage{stroke:#8a95a0;fill:#fafbfc;stroke-width:1.2}
      .nlbl{fill:#1a2530;font-size:16px;text-anchor:middle;font-weight:700}
      .nsub{fill:#4a5a63;font-size:11px;text-anchor:middle}
      .ann{fill:#33414d;font-size:12px}
      .annC{fill:#33414d;font-size:11.5px;text-anchor:middle}
      .stg{fill:#33414d;font-size:11px;text-anchor:middle;font-weight:700}
      .stgs{fill:#6a7580;font-size:9.5px;text-anchor:middle}
      .transh{fill:#8a5a1a;font-size:16px;font-weight:700}
      .transb{fill:#4a3a24;font-size:12px}
      .amber{fill:#9a7a3a}
      .idn{fill:#6b2d3e}
      .flow{stroke:#444;stroke-width:1.7;fill:none}
      .fb{stroke:#c98a2a;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
      .loopI{stroke:#6b2d3e;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
      .loopK{stroke:#2f7d7d;stroke-width:1.5;fill:none;stroke-dasharray:5 4}
      .dash{stroke:#8a95a0;stroke-width:1.3;fill:none;stroke-dasharray:5 4}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1080" height="800"/>

  <!-- Title -->
  <text class="title" x="540" y="38" font-size="25" text-anchor="middle">シサク・ヒト変容理論</text>
  <text class="sub" x="540" y="60" font-size="14" text-anchor="middle">Shisaku Human Transformation Theory — SHTT（v0.2）</text>
  <text class="sub" x="540" y="80" font-size="12.5" text-anchor="middle">二相＝入口（IDION）／出口（四成分）　／　同じ変容が両端に立つ　／　帰趨＝残存／変容の二値が通し軸　／　上流依存＝前提優位理論</text>

  <!-- naming rule (top-right) -->
  <text class="footR" x="1040" y="104">略号：上位＝SHTT／成分＝SH＋頭字＋ST</text>
  <text class="footR" x="1040" y="118">軌跡 SHTST・表現 SHEST・距離 SHDST・共鳴 SHKST／IDION は略号なし（把手）</text>

  <!-- Premise Primacy -->
  <rect class="c-prem" x="44" y="96" width="176" height="40" rx="7"/>
  <text class="nlbl" x="132" y="114" font-size="13">前提優位（上流依存）</text>
  <text class="nsub" x="132" y="129" font-size="10">前提への介入をヒト種へ降ろした系</text>
  <path class="flow" d="M132,136 L132,158" marker-end="url(#arrow)"/>

  <!-- 入口 label -->
  <text class="idn" x="44" y="153" font-size="11" font-weight="700">【入口】</text>
  <text class="ann" x="1012" y="152" font-size="11" font-weight="700" fill="#2f7d7d" text-anchor="end">【出口】</text>

  <!-- Pipeline row -->
  <!-- 主体 = 駆動層 + 核(IDION) + 両端点 -->
  <rect class="c-idion" x="44" y="158" width="176" height="96" rx="8"/>
  <text class="nlbl" x="132" y="180" fill="#6b2d3e">主体</text>
  <text class="nsub" x="132" y="196" fill="#6b2d3e">核＝IDION（着眼・判定軸・宛先）</text>
  <rect class="c-drive" x="60" y="204" width="144" height="18" rx="4"/>
  <text class="nsub" x="132" y="217" fill="#a3472a" font-size="10">駆動層（力・欲望・核の下）</text>
  <text class="nsub" x="132" y="240" fill="#5b6b7a" font-size="10">＋両端点（距離）・個人／集合</text>
  <!-- 軌跡 -->
  <rect class="c-traj" x="242" y="168" width="176" height="76" rx="8"/>
  <text class="nlbl" x="330" y="192">軌跡 <tspan font-size="12" fill="#3a6a8a">SHTST</tspan></text>
  <text class="nsub" x="330" y="212">何を体験させ何を変容させるか</text>
  <text class="nsub" x="330" y="228" fill="#3a6a8a">落差・予測配置</text>
  <!-- 表現 -->
  <rect class="c-expr" x="440" y="168" width="176" height="76" rx="8"/>
  <text class="nlbl" x="528" y="192">表現 <tspan font-size="12" fill="#4a7a4a">SHEST</tspan></text>
  <text class="nsub" x="528" y="212">どう実装するか</text>
  <text class="nsub" x="528" y="228" fill="#4a7a4a">基体×構成操作・IDION 依存</text>
  <!-- 距離 -->
  <rect class="c-dist" x="638" y="168" width="176" height="76" rx="8"/>
  <text class="nlbl" x="726" y="192">距離 <tspan font-size="12" fill="#6a5a8a">SHDST</tspan></text>
  <text class="nsub" x="726" y="212">何が届き何が届かないか</text>
  <text class="nsub" x="726" y="228" fill="#6a5a8a">多次元の距離・場・接触後の更新</text>
  <!-- 共鳴 -->
  <rect class="c-kyo" x="836" y="168" width="176" height="76" rx="8"/>
  <text class="nlbl" x="924" y="192">共鳴 <tspan font-size="12" fill="#2f7d7d">SHKST</tspan></text>
  <text class="nsub" x="924" y="212">実際に何が鳴ったか</text>
  <text class="nsub" x="924" y="228" fill="#2f7d7d">受容・帰趨の機構（受け手側）</text>

  <!-- horizontal flow arrows -->
  <path class="flow" d="M220,206 L242,206" marker-end="url(#arrow)"/>
  <path class="flow" d="M418,206 L440,206" marker-end="url(#arrow)"/>
  <path class="flow" d="M616,206 L638,206" marker-end="url(#arrow)"/>
  <path class="flow" d="M814,206 L836,206" marker-end="url(#arrow)"/>

  <!-- 交点条項 annotation -->
  <text class="annC" x="528" y="262" font-size="10.5" fill="#6b2d3e">IDION は共鳴の必要条件でなく、影響する上流条件（受け手の防衛を貫きやすい・偽装は弾かれやすい／入口と出口の量的対応は仮定しない）</text>

  <!-- Eight stages strip (両端共通) -->
  <text class="ann" x="44" y="292" font-weight="700" fill="#3a4a55">両端共通の過程＝八段（正本 SHTT §1・詳細は補足 shtt-process-stages.md）</text>
  <g>
    <rect class="c-stage" x="44" y="300" width="112" height="46" rx="6"/>
    <text class="stg" x="100" y="318">0 接触</text><text class="stgs" x="100" y="333">四成分・刺激源</text>
    <rect class="c-stage" x="166" y="300" width="112" height="46" rx="6"/>
    <text class="stg" x="222" y="318">1 気づき</text><text class="stgs" x="222" y="333">注意が意識へ上がる</text>
    <rect class="c-stage" x="288" y="300" width="112" height="46" rx="6" stroke="#2f7d7d"/>
    <text class="stg" x="344" y="318">2 再演段</text><text class="stgs" x="344" y="333">共鳴深度・強度・負荷</text>
    <rect class="c-stage" x="410" y="300" width="112" height="46" rx="6" stroke="#2f7d7d"/>
    <text class="stg" x="466" y="318">3 照合段</text><text class="stgs" x="466" y="333">四枡・当たった水準</text>
    <rect class="c-stage" x="532" y="300" width="112" height="46" rx="6" stroke="#a3472a" stroke-width="1.8"/>
    <text class="stg" x="588" y="318" fill="#a3472a">4 承認段＝関門</text><text class="stgs" x="588" y="333">検知→候補の核→承認</text>
    <rect class="c-stage" x="654" y="300" width="112" height="46" rx="6" stroke="#b07a3a"/>
    <text class="stg" x="710" y="318">5 書き換え段</text><text class="stgs" x="710" y="333">変容深度・変容広さ</text>
    <rect class="c-stage" x="776" y="300" width="112" height="46" rx="6" stroke="#b07a3a"/>
    <text class="stg" x="832" y="318">6 定常化段</text><text class="stgs" x="832" y="333">持続</text>
    <rect class="c-stage" x="898" y="300" width="114" height="46" rx="6"/>
    <text class="stg" x="955" y="318">7 折り返し段</text><text class="stgs" x="955" y="333">自己ループ／外側ループ</text>
  </g>
  <path class="flow" d="M156,323 L166,323"/><path class="flow" d="M278,323 L288,323"/><path class="flow" d="M400,323 L410,323"/>
  <path class="flow" d="M522,323 L532,323"/><path class="flow" d="M644,323 L654,323"/><path class="flow" d="M766,323 L776,323"/><path class="flow" d="M888,323 L898,323"/>
  <text class="annC" x="528" y="364" font-size="10.5">共鳴＝再演段〜照合段の総称（段名でない）　／　承認段の出口＝充足・書き換え要求・保留・却下　／　段は位置・機構（再演・照合・駆動・注意）は全段で働き続ける</text>

  <!-- 帰趨 band -->
  <rect class="c-trans" x="44" y="380" width="968" height="136" rx="10"/>
  <text class="transh" x="62" y="406">帰趨 ＝ 残存 ／ 変容（二値・成分ごと・「消える」枡は無い）——変容が通し軸</text>
  <text class="transb" x="62" y="430">・変容＝判定の値が動いた、または括りが変わって意図的に戻せない差分。残存＝残るが判定は動いていない（格納・未説明・保留・在庫＝後の結合の材料）。</text>
  <text class="transb" x="62" y="452">・帰趨は接触の四成分（対象・状況・自己観測・提示物）ごと・対象層ごとに読む。不可逆は意図に対して（巻き戻しは新しい変容）。減衰は持続の軸。</text>
  <text class="transb" x="62" y="474">・深度語彙：変容深度（最長のたどり）≠変容広さ（本数）≠自己距離（帰属）≠持続≠在庫／共鳴深度≠共鳴強度≠共鳴距離≠共鳴負荷／深度≠種類（対象層）。</text>
  <text class="transb" x="62" y="496" fill="#7a5a2a">・累積は加算でなく結合（規則の正本＝IDION「累積の結合則」）。目標変容 ≠ 実際の変容——その差が自己監査（しっくり感）の信号。</text>

  <!-- loops -->
  <!-- self loop (IDION side) -->
  <path class="loopI" d="M955,346 L1052,346 L1052,136 L132,136 L132,158" marker-end="url(#arrowIdion)"/>
  <text class="idn" x="560" y="132" font-size="10.5">自己ループ：新しい核が次の照合の基準（折り返し段・両端とも）</text>
  <!-- outer loop (receiver becomes next subject) -->
  <path class="loopK" d="M1012,206 L1064,206 L1064,522 L26,522 L26,206 L44,206" marker-end="url(#arrowKyo)"/>
  <text class="ann" x="62" y="536" font-size="11" fill="#2f7d7d">外側ループ：受け手の反応 → 表現者への次の接触／受け手が次の主体になる（再拡散・独り言＝自己と同一）</text>
  <!-- feedback (goal - actual) -->
  <path class="fb" d="M44,400 C34,400 40,290 100,262 L100,254" marker-end="url(#arrowAmber)"/>
  <text class="amber" x="62" y="556" font-size="11">較正ループ：目標−実際の差 → 自己監査 → 主体へ（表現者側のみ・計画・周期・意図との照合も表現者側のみ＝両端非対称）</text>

  <!-- notes row -->
  <rect class="c-prem" x="44" y="576" width="480" height="70" rx="8"/>
  <text class="ann" x="58" y="596" font-weight="700" fill="#3a4a55">フィードバック系・二相</text>
  <text class="ann" x="58" y="613" font-size="11">上流依存（逆算従属）を保ちつつ、実装・受容の再知覚が上流を書き換える。</text>
  <text class="ann" x="58" y="628" font-size="11">IDION は成分でなく入口側の構造理論。成分は四つ。主体＝駆動層＋核＋両端点。</text>
  <text class="ann" x="58" y="643" font-size="11">KOSEI（個性）は IDION の日本語グロス（署名の層／原始項の層）。</text>

  <rect class="c-prem" x="540" y="576" width="472" height="70" rx="8"/>
  <text class="ann" x="554" y="596" font-weight="700" fill="#3a4a55">接合</text>
  <text class="ann" x="554" y="613" font-size="11">予測誤差の二役（距離＝静的な量／軌跡・表現＝動的な原理）＝接合の候補・要検証。</text>
  <text class="ann" x="554" y="628" font-size="11">受け手側の防衛トリガ（作為の認知・視線の感知）＝信頼＝距離更新の重み → SHDST が引き取る。</text>
  <text class="ann" x="554" y="643" font-size="11">共鳴距離＝接触後の距離更新（正本 SHDST）。</text>

  <!-- Ethics band -->
  <rect class="c-eth" x="44" y="660" width="968" height="46" rx="8"/>
  <text class="ann" x="60" y="681" font-size="12.5" font-weight="700" fill="#7a5a3a">倫理＝操作構造の境界（四成分に共通・不可分）</text>
  <text class="ann" x="60" y="698" font-size="11.5">開示された誘導＝招待／隠して自己選択を奪う誘導＝操作。　透明性・自己選択・賞味期限・自己更新の不可侵（境界は動機でなく「開かれているか」で引く）。</text>

  <!-- Audit note + credit -->
  <text class="foot" x="44" y="730">接地は進化的（動物行動学・進化心理学・コストリー・シグナリング・予測符号化・記憶の再固定化・神経可塑性…）＝傍証であって証明でない。クオリア発生は哲学的原始項。設計・監査用（生成非注入）。</text>
  <text class="foot" x="44" y="748">補足：変容の対象層 shtt-object-layers.md／深度語彙 shtt-depth-terms.md／変容の過程の八段 shtt-process-stages.md／資料の置き場 authoring-policy.md（リポジトリ直下）</text>
