<?xml version="1.0" encoding="UTF-8"?>
<!--
  シサク・クオリア解釈 (Shisaku Qualia-Interpretation) v0.2.2 — 現れるものは多くの次元を持ち、出るたびに減る
  設計・監査用の図（人間向け）。学説は傍証であって証明ではない。生成非注入。
  統一様式 v1（四成分の固定色：軌跡=青／表現=緑／距離=紫／共鳴=teal／変容=橙）。本図の主役＝クオリア（スレート）。再帰の矢印だけ族の固定色（橙）を借りる。
  本図は「私はこう解釈する」の節の機構だけを引き受ける。射程（「はじめに」の役）・表出の形の一覧（補足の役）・置換の検査は図にしない。
  Copyright (c) 2026 shisaku. Licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/).
  Author: https://note.com/abstraction
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 630" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f4a52"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#9aa3aa"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07a3a"/></marker>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#eef1f3"/><stop offset="1" stop-color="#3f4a52"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="630" fill="#ffffff"/>
  <text x="40" y="44" font-size="21" font-weight="700" fill="#111">シサク・クオリア解釈——現れるものは多くの次元を持ち、出るたびに減る</text>
  <text x="40" y="68" font-size="13" fill="#666">元の次元をそのまま保っているのは、クオリアそのものだけになる。</text>

  <!-- 三つの場 -->
  <rect x="40"  y="96" width="220" height="300" rx="10" fill="#f7f8f9" stroke="#d8dee2"/>
  <rect x="316" y="96" width="318" height="300" rx="10" fill="#eef1f3" stroke="#c9d1d6"/>
  <rect x="666" y="96" width="374" height="300" rx="10" fill="#fbfbfc" stroke="#e2e6e9"/>
  <text x="150" y="124" font-size="15" font-weight="700" fill="#6b757c" text-anchor="middle">先に在るもの</text>
  <text x="475" y="124" font-size="15" font-weight="700" fill="#3f4a52" text-anchor="middle">減っていない側</text>
  <text x="853" y="124" font-size="15" font-weight="700" fill="#8a949b" text-anchor="middle">出たもの＝クオリア表出</text>

  <!-- 先に在るもの -->
  <rect x="62" y="150" width="176" height="58" rx="6" fill="#e8ecef" stroke="#3f4a52" stroke-width="1.4"/>
  <text x="150" y="174" font-size="13.5" font-weight="700" fill="#2b343a" text-anchor="middle">予測モデル</text>
  <text x="150" y="194" font-size="12" fill="#5c666d" text-anchor="middle">期待を先に出す側</text>
  <rect x="62" y="248" width="176" height="58" rx="6" fill="#f2f4f5" stroke="#7d868d" stroke-width="1.4"/>
  <text x="150" y="272" font-size="13.5" font-weight="700" fill="#4c565d" text-anchor="middle">接触</text>
  <text x="150" y="292" font-size="12" fill="#6b757c" text-anchor="middle">入ってきたもの</text>

  <!-- ズレ -->
  <line x1="240" y1="182" x2="320" y2="212" stroke="#3f4a52" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="240" y1="272" x2="320" y2="264" stroke="#3f4a52" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="338" y="172" font-size="12.5" font-weight="700" fill="#3f4a52" text-anchor="middle">照合</text>
  <text x="338" y="192" font-size="10.5" fill="#6b757c" text-anchor="middle">一致</text>
  <rect x="331" y="200" width="14" height="96" rx="2" fill="url(#g)" stroke="#9aa3aa" stroke-width="0.8"/>
  <text x="338" y="312" font-size="10.5" fill="#6b757c" text-anchor="middle">不一致</text>
  <line x1="352" y1="246" x2="402" y2="246" stroke="#3f4a52" stroke-width="1.8" marker-end="url(#a)"/>

  <!-- クオリア＝多くの次元。軸を持たない密な塊 -->
  <g>
    <ellipse cx="470" cy="238" rx="64" ry="30" fill="#3f4a52" opacity="0.16" transform="rotate(-24 470 238)"/>
    <ellipse cx="478" cy="246" rx="58" ry="36" fill="#3f4a52" opacity="0.14" transform="rotate(38 478 246)"/>
    <ellipse cx="462" cy="252" rx="48" ry="44" fill="#3f4a52" opacity="0.15" transform="rotate(8 462 252)"/>
    <ellipse cx="486" cy="228" rx="40" ry="24" fill="#6b757c" opacity="0.22" transform="rotate(64 486 228)"/>
    <ellipse cx="452" cy="232" rx="34" ry="20" fill="#6b757c" opacity="0.24" transform="rotate(-52 452 232)"/>
    <ellipse cx="474" cy="266" rx="44" ry="18" fill="#6b757c" opacity="0.2" transform="rotate(16 474 266)"/>
    <ellipse cx="456" cy="244" rx="22" ry="34" fill="#3f4a52" opacity="0.18" transform="rotate(-8 456 244)"/>
    <ellipse cx="492" cy="252" rx="26" ry="30" fill="#3f4a52" opacity="0.16" transform="rotate(48 492 252)"/>
    <path d="M410,246 C438,208 500,214 522,240" fill="none" stroke="#3f4a52" stroke-width="1.2" opacity="0.5"/>
    <path d="M414,262 C446,292 504,288 528,254" fill="none" stroke="#3f4a52" stroke-width="1.2" opacity="0.45"/>
    <path d="M440,214 C460,248 462,272 452,290" fill="none" stroke="#6b757c" stroke-width="1.1" opacity="0.5"/>
    <path d="M498,212 C486,244 490,274 504,286" fill="none" stroke="#6b757c" stroke-width="1.1" opacity="0.5"/>
    <path d="M424,236 C462,230 500,262 520,268" fill="none" stroke="#3f4a52" stroke-width="1" opacity="0.4"/>
  </g>
  <text x="470" y="330" font-size="15" font-weight="700" fill="#2b343a" text-anchor="middle">クオリア</text>
  <text x="470" y="352" font-size="12.5" fill="#5c666d" text-anchor="middle">予測モデルと接触の照合に伴って現れる信号。一致も不一致も、あいだの全域も。</text>
  <text x="470" y="370" font-size="12.5" fill="#5c666d" text-anchor="middle">多くの次元を持つ。本書はこれを種類で分けない。</text>

  <!-- 出る経路 -->
  <line x1="540" y1="220" x2="676" y2="172" stroke="#3f4a52" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="546" y1="249" x2="676" y2="250" stroke="#3f4a52" stroke-width="1.6" marker-end="url(#a)"/>
  <line x1="540" y1="276" x2="676" y2="330" stroke="#3f4a52" stroke-width="1.6" marker-end="url(#a)"/>

  <!-- 出たもの：どれも次元が少ない -->
  <rect x="716" y="148" width="10" height="46" fill="#6b757c"/>
  <line x1="704" y1="148" x2="738" y2="148" stroke="#9aa3aa" stroke-width="1"/>
  <line x1="704" y1="194" x2="738" y2="194" stroke="#9aa3aa" stroke-width="1"/>
  <text x="778" y="166" font-size="13.5" font-weight="700" fill="#4c565d">鳥肌</text>
  <text x="778" y="186" font-size="12.5" fill="#6b757c">ごくわずかな次元に減った</text>

  <rect x="700" y="236" width="56" height="26" rx="13" fill="#d7dcdf" stroke="#9aa3aa" stroke-width="1"/>
  <text x="728" y="254" font-size="12" fill="#4c565d" text-anchor="middle">不安</text>
  <text x="778" y="246" font-size="13.5" font-weight="700" fill="#4c565d">「不安」という語</text>
  <text x="778" y="266" font-size="12.5" fill="#6b757c">その瞬間の感覚に貼られた、既製のラベル</text>

  <polygon points="706,324 762,324 752,338 696,338" fill="#9aa3aa"/>
  <text x="778" y="330" font-size="13.5" font-weight="700" fill="#4c565d">「半音下がった」</text>
  <text x="778" y="350" font-size="12.5" fill="#6b757c">五文字になった</text>

  <text x="690" y="378" font-size="11.5" fill="#9aa3aa">※ 形は候補であって網羅ではない。一覧と例は補足が持つ。</text>

  <!-- 再帰 -->
  <path d="M853,400 L853,432 L150,432 L150,312" fill="none" stroke="#b07a3a" stroke-width="2" marker-end="url(#ao)"/>
  <text x="520" y="424" font-size="12.5" font-weight="700" fill="#8a5f28" text-anchor="middle">出たものが、また接触になる——予測モデルは、いつもの仕事をしている</text>

  <!-- 読み -->
  <line x1="40" y1="470" x2="1040" y2="470" stroke="#e2e6e9"/>
  <text x="40" y="498" font-size="13.5" fill="#333">出るたびに次元が減る。鳥肌も、語も、理解も、元より少ない。<tspan font-weight="700">元の次元をそのまま保っているのは、クオリアそのものだけになる。</tspan></text>
  <text x="40" y="522" font-size="13.5" fill="#333">同じ一つのものから、違う方向へ減って出る。<tspan font-weight="700">鳥肌に入らなかったものと、「半音下がった」に入らなかったものは、同じではない。</tspan></text>
  <text x="40" y="546" font-size="13.5" fill="#333">出たものは、また接触になる。<tspan font-weight="700">出るときは減る。戻ったものは新しく照合され、そこで新しい信号が生まれる。</tspan></text>

  <text x="40" y="576" font-size="12" fill="#777">※ この図も減らしている。図に描けている時点で、実物より次元が少ない。クオリアの発生は、本書では扱わない。</text>
  <text x="40" y="610" font-size="11" fill="#777">シサク・クオリア解釈 v0.2.2 ／ 設計・監査用の図（人間向け）。生成非注入。</text>
  <text x="1040" y="610" font-size="11" fill="#777" text-anchor="end">CC BY 4.0 — shisaku</text>
</svg>
