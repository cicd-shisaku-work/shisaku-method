<?xml version="1.0" encoding="UTF-8"?>
<!--
  シサク・ヒト IDION 構造理論 (Shisaku Human IDION-Structure Theory) v0.3 — IDION の形成の構造
  設計・監査用の図（人間向け）。本文 v0.3 から描いた。学説は傍証であって証明ではない。生成非注入。
  統一様式 v1（四成分の固定色：軌跡=青／表現=緑／距離=紫／共鳴=teal／変容=橙）。本図の主役＝IDION（葡萄色）。駆動＝赤褐。
  Copyright (c) 2026 shisaku. Licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/).
  Author: https://note.com/abstraction
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 1000" font-family="'Hiragino Sans','Noto Sans JP','Noto Sans CJK JP','Yu Gothic',sans-serif" font-size="14">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#444"/></marker>
    <marker id="arrg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8a8a8a"/></marker>
    <marker id="arrd" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#a3472a"/></marker>
    <marker id="arri" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6b2d3e"/></marker>
    <marker id="arrt" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07a3a"/></marker>
  </defs>
  <rect width="1500" height="1000" fill="#ffffff"/>
  <text x="30" y="34" font-size="22" font-weight="700" fill="#111">シサク・ヒト IDION 構造理論——IDION はどう形作られるか（形成の構造）</text>
  <text x="30" y="56" font-size="13" fill="#555">接触が既存の予測モデルと照合され、説明できずに違和感が生じ、駆動が「無視できない」と鳴らすと、書き換え要求が立つ。変容コスト（抵抗との闘い／統合）を経て、予測モデルが書き換わる（＝変容）。</text>
  <text x="30" y="74" font-size="13" fill="#555">書き換わった予測モデルは、次の接触を照合する側に回る。IDION は表現化して受け手へ出て、受け手の反応と、自分の言葉が、次の接触になる。</text>

  <!-- 読み方 -->
  <g font-size="11" fill="#444">
    <text x="30" y="100" font-weight="700" font-size="12">読み方</text>
    <text x="30" y="117">・実線＝一回の接触の流れ。破線＝時間をまたぐ経路（保留・未説明のままの格納・表現からの戻り）。赤褐＝駆動。</text>
    <text x="30" y="133">・IDION＝接触によって変容するその人の予測モデル（記憶を含む）と、それを用いて認知し、判定する機構と、それらを動かす身体駆動。主体はその人で、駆動はその人の中の力。</text>
    <text x="30" y="149">・変容＝既存の予測モデルが書き換わること。向きを問わない（良いものとは限らない）。感情が動いても、新しい記憶が加わっても、既存の予測モデルが書き換わらなければ変容でない。</text>
    <text x="30" y="165">・変容コスト（書き換えを成立させる内部の処理）≠ 変容量（予測モデルがどれだけ書き換わったか）≠ 外形の負担（時間・労力＝接触の側の性質）。</text>
    <text x="30" y="181">・変容量は、縦＝深さ（変容の距離）と、横＝結合（A＋B→C・点→線→面）。変容量 ≠ 人間的価値。</text>
  </g>

  <!-- IDION -->
  <rect x="240" y="200" width="900" height="200" rx="10" fill="#f3e9ec" stroke="#6b2d3e" stroke-width="2"/>
  <text x="256" y="226" font-size="17" font-weight="700" fill="#6b2d3e">IDION ＝ 予測モデル ＋ 機構 ＋ 身体駆動（下の帯）</text>
  <text x="256" y="246" font-size="11" fill="#4a1f2c">ヒト種に普遍の構造／表現が湧き出す入口の基体／固有／非移転・非交換／基準（平均）を持たない</text>
  <rect x="256" y="258" width="560" height="108" rx="6" fill="#e8d6dc" stroke="#6b2d3e" stroke-width="1"/>
  <text x="270" y="280" font-size="13" font-weight="700" fill="#4a1f2c">予測モデル——接触によって変容する</text>
  <g font-size="11" fill="#4a1f2c">
    <text x="270" y="298">世界・他者・自分・自分の機構についての予測モデル。無数にあり、粒度の違うものが重なる</text>
    <text x="270" y="314">記憶も予測モデルの側にある（多くは、取り出すときに言葉になる）</text>
    <text x="270" y="330">言語化できる部分と、できない部分（手・身体・判定の癖）</text>
    <text x="270" y="346">書き換わった予測モデルは、次の接触を照合する側に回る（濾す側＝形作られる側）</text>
  </g>
  <rect x="828" y="258" width="298" height="108" rx="6" fill="#faf4f6" stroke="#6b2d3e" stroke-width="1"/>
  <text x="842" y="280" font-size="13" font-weight="700" fill="#4a1f2c">機構</text>
  <text x="842" y="300" font-size="11" fill="#4a1f2c">予測モデルを用いて、認知し、判定する</text>
  <text x="842" y="318" font-size="11" fill="#4a1f2c">照合し、判定を下すのは機構</text>
  <text x="842" y="336" font-size="11" fill="#4a1f2c">接触では変わらない（ヒト種に普遍）</text>
  <text x="842" y="354" font-size="10" fill="#777">変わるのは、機構が用いる予測モデル</text>
  <path d="M828,374 H345 V402" stroke="#6b2d3e" stroke-width="1.2" fill="none" stroke-dasharray="4 3"/>
  <text x="256" y="388" font-size="11" fill="#6b2d3e">IDION の層：着眼（何を見るか）・判定軸（何で評価するか）・自己像・世界解釈——何が書き換わったかの対象であって、深さの目盛りではない</text>

  <!-- 濾す（IDION → 照合） -->
  <path d="M345,402 L345,478" stroke="#6b2d3e" stroke-width="1.4" fill="none" marker-end="url(#arri)"/>
  <text x="353" y="432" font-size="11" fill="#6b2d3e">IDION が接触を濾す</text>
  <text x="353" y="446" font-size="11" fill="#6b2d3e">機構が予測モデルを</text>
  <text x="353" y="460" font-size="11" fill="#6b2d3e">用いて照合し、判定する</text>
  <!-- 格納（照合 → 記憶） -->
  <path d="M300,494 L300,402" stroke="#999" stroke-width="1.2" fill="none" marker-end="url(#arrg)"/>
  <g font-size="11" fill="#666" text-anchor="end">
    <text x="292" y="424">説明・吸収できる</text>
    <text x="292" y="438">→ 記憶として格納</text>
    <text x="292" y="452">（既存の予測モデルは</text>
    <text x="292" y="466">書き換わらない）</text>
  </g>

  <!-- 接触 -->
  <rect x="30" y="480" width="170" height="120" rx="8" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="115" y="506" text-anchor="middle" font-weight="700">接触</text>
  <text x="115" y="529" text-anchor="middle" font-size="11">外部刺激（世界・他者・表現）</text>
  <text x="115" y="547" text-anchor="middle" font-size="11">内部刺激（内省・想起・夢）</text>
  <text x="115" y="571" text-anchor="middle" font-size="10.5" fill="#666">外形の負担（時間・労力）は</text>
  <text x="115" y="586" text-anchor="middle" font-size="10.5" fill="#666">接触の側の性質＝コストでない</text>
  <path d="M200,540 L238,540" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 照合 -->
  <polygon points="330,480 420,540 330,600 240,540" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="330" y="536" text-anchor="middle" font-size="13" font-weight="700">既存の予測モデル</text>
  <text x="330" y="554" text-anchor="middle" font-size="13" font-weight="700">と照合</text>

  <!-- 照合 → 違和感 -->
  <path d="M420,540 L478,540" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="449" y="530" text-anchor="middle" font-size="10.5">説明できない</text>
  <rect x="480" y="502" width="150" height="76" rx="8" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="555" y="527" text-anchor="middle" font-weight="700">違和感</text>
  <text x="555" y="546" text-anchor="middle" font-size="11">「何かがおかしい」</text>
  <text x="555" y="563" text-anchor="middle" font-size="11">＝予測誤差</text>
  <!-- 違和感 → 記憶（駆動が鳴らさない） -->
  <path d="M555,502 L555,402" stroke="#999" stroke-width="1.1" fill="none" stroke-dasharray="3 3" marker-end="url(#arrg)"/>
  <g font-size="10.5" fill="#777">
    <text x="563" y="430">駆動が鳴らさなければ</text>
    <text x="563" y="444">→ 未説明の記憶として格納</text>
    <text x="563" y="458">（後の結合の材料）</text>
  </g>

  <!-- 違和感 → 書き換え要求（駆動が鳴らす） -->
  <path d="M555,578 L555,628" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <text x="547" y="608" text-anchor="end" font-size="11" fill="#a3472a">駆動が「無視できない」と鳴らす</text>
  <rect x="480" y="630" width="150" height="52" rx="8" fill="#fff" stroke="#444" stroke-width="1.5"/>
  <text x="555" y="652" text-anchor="middle" font-weight="700">書き換え要求</text>
  <text x="555" y="670" text-anchor="middle" font-size="11">予測モデルへの</text>
  <path d="M630,656 L678,656" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- 変容コスト -->
  <rect x="680" y="570" width="250" height="186" rx="8" fill="#fbf1ec" stroke="#a3472a" stroke-width="1.5"/>
  <text x="805" y="592" text-anchor="middle" font-size="12.5" font-weight="700" fill="#a3472a">変容コスト</text>
  <g font-size="10.5" text-anchor="middle" fill="#333">
    <text x="805" y="609">書き換えを成立させる内部の処理</text>
    <text x="805" y="628">抵抗・慣性なし → 統合（保留が結合して解ける）</text>
    <text x="805" y="644">抵抗か慣性あり → 抵抗との闘い</text>
    <text x="805" y="662" fill="#7a3a22">抵抗の強さ：積み上げてきたもの・失うもの・</text>
    <text x="805" y="677" fill="#7a3a22">その上に立つもの（自己規定と優先）・駆動の向き</text>
    <text x="805" y="693" fill="#7a3a22">否定であるだけでは、抵抗は出ない</text>
    <text x="805" y="709">防衛＝駆動が押し返す</text>
    <text x="805" y="724">慣性＝予測モデルが追いつかない</text>
    <text x="805" y="742">快にも痛にもなる／変容コスト ≠ 変容量</text>
  </g>

  <!-- 出口：書き換え（→ IDION の予測モデル） -->
  <path d="M720,568 L720,402" stroke="#b07a3a" stroke-width="1.7" fill="none" marker-end="url(#arrt)"/>
  <text x="728" y="450" font-size="10.5" fill="#8a5a1a">欲求側が勝つ</text>
  <text x="728" y="464" font-size="10.5" fill="#8a5a1a">→ 受容的な書き換え</text>
  <path d="M900,568 L900,402" stroke="#b07a3a" stroke-width="1.4" fill="none" stroke-dasharray="6 3" marker-end="url(#arrt)"/>
  <text x="908" y="450" font-size="10.5" fill="#8a5a1a">忌避側が勝つ</text>
  <text x="908" y="464" font-size="10.5" fill="#8a5a1a">→ 防御的な書き換え（しばしば深い）</text>
  <text x="732" y="506" font-size="11" font-weight="700" fill="#8a5a1a">書き換え＝変容</text>
  <text x="732" y="522" font-size="10.5" fill="#8a5a1a">（漸進しうる）</text>

  <!-- 保留 -->
  <path d="M805,756 L805,776" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrg)"/>
  <rect x="690" y="778" width="230" height="62" rx="8" fill="#f4f4f2" stroke="#666" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="805" y="799" text-anchor="middle" font-size="12" font-weight="700" fill="#444">保留——決着せず</text>
  <text x="805" y="816" text-anchor="middle" font-size="10.5" fill="#555">要求は保留されたまま、後の接触を待つ</text>
  <text x="805" y="832" text-anchor="middle" font-size="10.5" fill="#555">自覚なし＝一度気づいて置き、いま意識の外</text>
  <path d="M690,809 L330,809 L330,604" stroke="#666" stroke-width="1.2" fill="none" stroke-dasharray="5 3" marker-end="url(#arrg)"/>
  <text x="350" y="827" font-size="11" fill="#666">後の接触が契機で結合する（十年後でも）</text>

  <!-- 駆動 -->
  <rect x="240" y="852" width="900" height="64" rx="8" fill="#fbf1ec" stroke="#6b2d3e" stroke-width="2"/>
  <text x="690" y="876" text-anchor="middle" font-size="13" font-weight="700" fill="#a3472a">身体駆動（欲求／忌避）——IDION の三つ目の部分。身体の恒常性と生存から出る力。予測モデルと機構を動かす</text>
  <text x="690" y="900" text-anchor="middle" font-size="11" fill="#7a3a22">「無視できない」と鳴らす／押し返す（防衛）／向きと強さで書き換えの行き先が決まる——閾値・強さは固有で接触では変わらない（変わるのは制御）</text>
  <path d="M650,850 L650,604 L559,604" stroke="#a3472a" stroke-width="1.4" fill="none" marker-end="url(#arrd)"/>
  <path d="M960,850 L960,655 L932,655" stroke="#a3472a" stroke-width="1.4" fill="none" marker-end="url(#arrd)"/>
  <text x="968" y="700" font-size="10.5" fill="#a3472a">防衛（押し返す）</text>
  <text x="968" y="714" font-size="10.5" fill="#a3472a">／向きと強さ</text>
  <path d="M1140,884 L1160,884 L1160,300 L1142,300" stroke="#a3472a" stroke-width="1.2" fill="none" stroke-dasharray="4 3" marker-end="url(#arrd)"/>
  <text x="1152" y="770" text-anchor="end" font-size="10.5" fill="#a3472a">予測モデルを使う</text>

  <!-- 表現化 -->
  <path d="M1140,260 L1178,260" stroke="#444" stroke-width="1.5" marker-end="url(#arr)"/>
  <rect x="1180" y="200" width="290" height="180" rx="8" fill="#eef5ee" stroke="#4a7a4a" stroke-width="1.5"/>
  <text x="1325" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#3a6a3a">表現化</text>
  <g font-size="11" text-anchor="middle" fill="#333">
    <text x="1325" y="246">言語化＝論旨（IDION の部分／全体の言語化）</text>
    <text x="1325" y="264">身体化＝手・動き</text>
    <text x="1325" y="282">合成＝自分の体験からのシミュレーション</text>
    <text x="1325" y="304" fill="#666">IDION の射影——100% は一致しない</text>
    <text x="1325" y="322" fill="#666">他者・道具が演奏してよい</text>
    <text x="1325" y="338" fill="#666">／本人が照合し、引き受ける</text>
    <text x="1325" y="362" fill="#3a6a3a">言語化は読み出しでない（右の破線で戻る）</text>
  </g>

  <!-- 表現 → 受け手 -->
  <path d="M1325,380 L1325,428" stroke="#8a8a8a" stroke-width="1.5" marker-end="url(#arrg)"/>
  <rect x="1180" y="430" width="290" height="125" rx="8" fill="#f4f4f2" stroke="#999" stroke-width="1.2"/>
  <text x="1325" y="452" text-anchor="middle" font-size="12" font-weight="700" fill="#555">表現 → 受け手（出口＝受け手の変容）</text>
  <g font-size="10.5" text-anchor="middle" fill="#666">
    <text x="1325" y="472">表現側の不一致＝偽装</text>
    <text x="1325" y="488">（IDION に無いものを、自分の IDION から</text>
    <text x="1325" y="503">出たものとして表現する）</text>
    <text x="1325" y="522">実装側の不一致＝表現化の失敗（直せる）</text>
    <text x="1325" y="540">受け手には同じに見える／直し方が違う</text>
  </g>

  <!-- 判定の非対称 -->
  <rect x="1180" y="590" width="290" height="170" rx="8" fill="#fff" stroke="#6b2d3e" stroke-width="1.2"/>
  <text x="1325" y="612" text-anchor="middle" font-size="12" font-weight="700" fill="#6b2d3e">判定の非対称</text>
  <g font-size="10.5" fill="#4a1f2c">
    <text x="1194" y="634">本人＝一次：変容が、意識して呼び出さなくても</text>
    <text x="1194" y="650">　行動（内的・外的）に出るか／自己一致</text>
    <text x="1194" y="666">　／抵抗があればその大きさ（片側の指標）</text>
    <text x="1194" y="688">受け手＝二次：信号の偽装困難さから推定する</text>
    <text x="1194" y="710">理由は、読み出すのでなく探して当てる</text>
    <text x="1194" y="726">（判定がどの予測モデルを通ったかは、</text>
    <text x="1194" y="742">　本人も内から読み取れない）</text>
  </g>

  <!-- 戻り：言語化の折り返し・受け手の反応 → 接触 -->
  <path d="M1470,290 L1488,290" stroke="#4a7a4a" stroke-width="1.3" fill="none" stroke-dasharray="6 4"/>
  <text x="1495" y="300" font-size="10" fill="#3a6a3a" transform="rotate(90 1495 300)">言語化の折り返し</text>
  <path d="M1470,492 L1488,492" stroke="#444" stroke-width="1.2" fill="none" stroke-dasharray="7 4"/>
  <path d="M1488,290 L1488,962 L115,962 L115,602" stroke="#444" stroke-width="1.2" fill="none" stroke-dasharray="7 4" marker-end="url(#arr)"/>
  <text x="800" y="954" text-anchor="middle" font-size="11" fill="#333">受け手の反応・受け手の変容と、自分が言葉にしたもの（言語化は接触として本人に戻り、予測モデルを更新しうる・自己一致）が、次の接触になる</text>

  <!-- footer -->
  <text x="30" y="990" font-size="11" fill="#777">Shisaku Human IDION-Structure Theory v0.3 — 設計・監査用の図。本文 v0.3 から描いた。層の順序と語は目安であり固定しない。</text>
  <text x="1470" y="990" font-size="11" fill="#777" text-anchor="end">© 2026 shisaku · CC BY 4.0 · https://note.com/abstraction</text>
</svg>
