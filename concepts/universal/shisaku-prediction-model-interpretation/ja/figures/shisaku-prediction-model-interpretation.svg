<?xml version="1.0" encoding="UTF-8"?>
<!--
  シサク・予測モデル解釈 (Shisaku Prediction-Model Interpretation) v0.4 — 実体はどこに在り、何が出ていくか
  設計・監査用の図（人間向け）。学説は傍証である。生成非注入。
  統一様式 v1（四成分の固定色：軌跡=青／表現=緑／距離=紫／共鳴=teal／変容=橙）。本図の主役＝予測モデル（実体・スレート）。変容の矢印だけ族の固定色（橙）を借りる。
  本図は第2節だけを引き受ける。v0.4 で描き直し——本文の小節「言葉の側と身体の側」を反映（二つの側をどちらも身体の内に描き、言葉にしたものだけを外へ出す）。検討の中／外は状態なので場所に描かず、読みの行に置く。学説へのブリッジ・射程・相転移は図にしない。
  Copyright (c) 2026 shisaku. Licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/).
  Author: https://note.com/abstraction
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 716" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3f4a52"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b07a3a"/></marker>
  </defs>

  <rect width="1080" height="716" fill="#ffffff"/>
  <text x="40" y="44" font-size="21" font-weight="700" fill="#111">シサク・予測モデル解釈——実体はどこに在り、何が出ていくか</text>
  <text x="40" y="68" font-size="13" fill="#666">内から外へ。立体は動かない。出ていくのは、その影のほうである。</text>

  <!-- 二つの場所 -->
  <rect x="40"  y="96" width="660" height="380" rx="10" fill="#eef1f3" stroke="#c9d1d6"/>
  <rect x="748" y="96" width="292" height="380" rx="10" fill="#fbfbfc" stroke="#e2e6e9"/>
  <text x="370" y="124" font-size="15" font-weight="700" fill="#3f4a52" text-anchor="middle">身体の内</text>
  <text x="894" y="124" font-size="15" font-weight="700" fill="#8a949b" text-anchor="middle">身体の外</text>

  <!-- 身体の側＝立体（言語化の元） -->
  <polygon points="140,270 176,234 286,234 250,270" fill="#cfd8de" stroke="#3f4a52" stroke-width="1.6"/>
  <polygon points="250,270 286,234 286,344 250,380" fill="#b9c4cc" stroke="#3f4a52" stroke-width="1.6"/>
  <rect x="140" y="270" width="110" height="110" fill="#e8ecef" stroke="#3f4a52" stroke-width="1.6"/>
  <path d="M195,291 A34,34 0 1 1 161,325" fill="none" stroke="#b07a3a" stroke-width="2.2" marker-end="url(#ao)"/>
  <text x="205" y="408" font-size="15" font-weight="700" fill="#2b343a" text-anchor="middle">身体の側</text>
  <text x="205" y="427" font-size="12.5" fill="#5c666d" text-anchor="middle">やれること・変わったこと（腑に落ちる）</text>
  <text x="205" y="446" font-size="12" font-weight="700" fill="#8a5f28" text-anchor="middle">変容——接触と照合を経て食い違ったときに</text>

  <!-- 言葉の側＝薄い板（取り込まれた言葉から） -->
  <polygon points="454,234 590,234 590,244 454,244" fill="#d7dcdf" stroke="#7d868d" stroke-width="1.2"/>
  <polygon points="590,234 606,204 606,214 590,244" fill="#c8cfd3" stroke="#7d868d" stroke-width="1.2"/>
  <polygon points="470,204 606,204 590,234 454,234" fill="#eceff1" stroke="#7d868d" stroke-width="1.4"/>
  <text x="530" y="270" font-size="15" font-weight="700" fill="#2b343a" text-anchor="middle">言葉の側</text>
  <text x="530" y="289" font-size="12.5" fill="#5c666d" text-anchor="middle">言えること・分かったこと</text>
  <text x="530" y="307" font-size="12.5" fill="#5c666d" text-anchor="middle">（頭で理解する）</text>

  <!-- 言葉にしたもの＝影（完全な平面） -->
  <polygon points="820,352 984,352 960,372 796,372" fill="#9aa3aa" stroke="#8a949b" stroke-width="1"/>
  <text x="894" y="404" font-size="13.5" font-weight="700" fill="#5c666d" text-anchor="middle">言葉にしたもの</text>
  <text x="894" y="426" font-size="12.5" fill="#6b757c" text-anchor="middle">次元が落ちる。100% にならないのは、</text>
  <text x="894" y="444" font-size="12.5" fill="#6b757c" text-anchor="middle">容器の側の事情である。</text>

  <!-- 出ていく：身体が持つものが言葉と照合され、頭に浮かび、言葉にされる -->
  <line x1="296" y1="362" x2="788" y2="362" stroke="#3f4a52" stroke-width="1.8" marker-end="url(#a)"/>
  <text x="498" y="384" font-size="12.5" fill="#3f4a52" text-anchor="middle">言葉にする——身体が持つものが言葉と照合され、頭に浮かぶ</text>

  <!-- 戻る：言葉は接触として入る。取り込まれて言葉の側になり、照合で食い違えば身体の側も変わりうる -->
  <path d="M894,346 L894,152 L530,152 L530,196" fill="none" stroke="#b07a3a" stroke-width="1.8" stroke-dasharray="7 4" marker-end="url(#ao)"/>
  <path d="M530,152 L230,152 L230,226" fill="none" stroke="#b07a3a" stroke-width="1.4" stroke-dasharray="3 4" marker-end="url(#ao)"/>
  <text x="660" y="144" font-size="12.5" fill="#8a5f28" text-anchor="middle">身体の外から、接触として入る（自分が出した言葉も、他人の言葉も）</text>
  <text x="542" y="186" font-size="11.5" fill="#8a5f28" text-anchor="start">取り込まれて、言葉の側になる</text>
  <text x="246" y="186" font-size="11.5" fill="#8a5f28" text-anchor="start">照合で食い違えば、</text>
  <text x="246" y="201" font-size="11.5" fill="#8a5f28" text-anchor="start">身体の側も変わりうる</text>

  <text x="490" y="466" font-size="12.5" fill="#3f4a52" text-anchor="middle">どちらも予測モデルで、どちらも身体の内にある。二つは並んで在る。</text>

  <!-- 読み -->
  <line x1="40" y1="508" x2="1040" y2="508" stroke="#e2e6e9"/>
  <text x="40" y="538" font-size="13.5" fill="#333">言葉の側と身体の側は、<tspan font-weight="700">どちらも身体の内にある</tspan>。出ていくのは、言葉にしたものだけである。</text>
  <text x="40" y="562" font-size="13.5" fill="#333">論じる経路と変容の経路は別に進み、<tspan font-weight="700">つながり目は接触だけである</tspan>。</text>
  <text x="40" y="586" font-size="13.5" fill="#333">言葉が身体の側を変えるのは、接触として入り、照合で食い違ったときだけである。</text>
  <text x="40" y="610" font-size="13.5" fill="#333">前提として働いている＝検討の外にある状態。対象になる＝検討の中に入った状態。<tspan font-weight="700">変わるのは状態であって、実体ではない。</tspan></text>
  <text x="40" y="634" font-size="13.5" fill="#333">影は元の立体を言い尽くさない。写真が粗いからではなく、<tspan font-weight="700">撮った時点で次元が落ちているからである。</tspan></text>

  <text x="40" y="662" font-size="12" fill="#777">※「実体」は、本書が予測モデルをそう読むという位置づけである。物理的な一個の物を主張するものではない。</text>
  <text x="40" y="696" font-size="11" fill="#777">シサク・予測モデル解釈 v0.4 ／ 設計・監査用の図（人間向け）。生成非注入。</text>
  <text x="1040" y="696" font-size="11" fill="#777" text-anchor="end">CC BY 4.0 — shisaku</text>
</svg>
