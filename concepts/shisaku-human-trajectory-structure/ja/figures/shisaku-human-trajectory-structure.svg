<?xml version="1.0" encoding="UTF-8"?>
<!--
  シサク・ヒト軌跡構造理論 (Shisaku Human Trajectory-Structure Theory — SHTST)
  設計・監査用の図（人間向け）。学説は傍証であって証明ではない。生成非注入。
  統一様式 v1（四成分の固定色：軌跡=青／表現=緑／距離=紫／共鳴=teal／変容=橙）。本図の主役＝軌跡（青）。
  Copyright (c) 2026 shisaku. Licensed under CC BY 4.0 (https://creativecommons.org/licenses/by/4.0/).
  Author: https://note.com/abstraction
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 660" font-family="'Hiragino Sans','Noto Sans JP','Yu Gothic',sans-serif">
  <defs>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#444"/></marker>
    <marker id="arrowTraj" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#3a6a8a"/></marker>
    <marker id="arrowAmber" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto"><path d="M0,0 L8,4.5 L0,9 Z" fill="#c98a2a"/></marker>
    <style>
      .bg{fill:#ffffff}
      .title{fill:#111;font-weight:700}
      .sub{fill:#555}
      .foot{fill:#777;font-size:11px}
      .footR{fill:#777;font-size:11px;text-anchor:end}
      .c-traj{stroke:#3a6a8a;fill:#e9f1f7;stroke-width:1.5}
      .c-trans{stroke:#b07a3a;fill:#fbf3e8;stroke-width:1.6}
      .c-prem{stroke:#7a8a99;fill:#f4f6f8;stroke-width:1.4}
      .c-eth{stroke:#9a7a5a;fill:#f7f2ec;stroke-width:1.4}
      .nlbl{fill:#1a2530;font-size:16px;text-anchor:middle;font-weight:700}
      .ann{fill:#33414d;font-size:12px}
      .annC{fill:#33414d;font-size:11.5px;text-anchor:middle}
      .transh{fill:#8a5a1a;font-size:14px;font-weight:700}
      .transb{fill:#4a3a24;font-size:12px}
      .amber{fill:#9a7a3a}
      .axis{stroke:#99a4ad;stroke-width:1.2}
      .axlbl{fill:#5a6670;font-size:11.5px}
      .curveMain{stroke:#2f5e7e;stroke-width:2.6;fill:none}
      .curveCtr{stroke:#4a7a4a;stroke-width:2;fill:none;stroke-dasharray:6 4}
      .pt{fill:#2f5e7e}
      .ptlbl{fill:#22404f;font-size:12px;text-anchor:middle;font-weight:700}
      .gap{stroke:#c0392b;stroke-width:1.4;fill:none}
      .gaplbl{fill:#a5352a;font-size:11.5px}
      .band{fill:#eef3f7;stroke:#bcd0dd;stroke-width:1;stroke-dasharray:4 3}
      .pp{fill:#2f5e7e;font-size:11px;text-anchor:middle}
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1080" height="660"/>

  <!-- Title -->
  <text class="title" x="540" y="40" font-size="25" text-anchor="middle">シサク・ヒト軌跡構造理論</text>
  <text class="sub" x="540" y="63" font-size="14" text-anchor="middle">Shisaku Human Trajectory-Structure Theory — SHTST</text>
  <text class="sub" x="540" y="84" font-size="12.5" text-anchor="middle">何を体験させ何を変容させるか　／　多次元の目標体験の経路　／　落差と予測配置で駆動（SHTT の軌跡成分）</text>
  <text class="footR" x="1040" y="112">略号：上位＝SHTT／成分＝SH＋頭字＋ST</text>
  <text class="footR" x="1040" y="127">軌跡 SHTST・表現 SHEST・距離 SHDST・共鳴 SHKST</text>

  <!-- Plot area: time (x) × experience (y, multi-axis) -->
  <!-- optimum band -->
  <rect class="band" x="96" y="196" width="664" height="70"/>
  <text class="pp" x="690" y="188" text-anchor="end" fill="#7a8894">予測誤差の至適域＝「分かりそうで、まだ分からない」</text>
  <!-- axes -->
  <path class="axis" d="M96,160 L96,432 L760,432"/>
  <text class="axlbl" x="430" y="452" text-anchor="middle">時間 →</text>
  <text class="axlbl" x="80" y="300" text-anchor="middle" transform="rotate(-90 80,300)">体験（多次元）</text>

  <!-- counterpoint curve (green dashed) = 別の体験軸（例：期待/没入） -->
  <polyline class="curveCtr" points="126,404 276,368 426,306 576,300 700,250"/>
  <text class="ann" x="706" y="246" font-size="11" fill="#4a7a4a">対位軸（例：期待）</text>

  <!-- main trajectory (blue) -->
  <polyline class="curveMain" points="126,372 276,322 426,252 576,182 700,342"/>
  <circle class="pt" cx="126" cy="372" r="4.5"/>
  <circle class="pt" cx="276" cy="322" r="4.5"/>
  <circle class="pt" cx="426" cy="252" r="4.5"/>
  <circle class="pt" cx="576" cy="182" r="4.5"/>
  <circle class="pt" cx="700" cy="342" r="4.5"/>
  <text class="ptlbl" x="126" y="392">安心</text>
  <text class="ptlbl" x="276" y="342">違和感</text>
  <text class="ptlbl" x="426" y="240">緊張</text>
  <text class="ptlbl" x="576" y="170">恐怖</text>
  <text class="ptlbl" x="700" y="362">解放</text>

  <!-- 落差 (contrast/derivative) emphasis between 緊張→恐怖 -->
  <path class="gap" d="M600,252 L600,182"/>
  <path class="gap" d="M594,252 L606,252"/>
  <path class="gap" d="M594,182 L606,182"/>
  <text class="gaplbl" x="612" y="222">落差 Δ</text>
  <text class="gaplbl" x="612" y="238" font-size="10.5">＝設計の単位（差分）</text>

  <!-- prediction placement markers -->
  <text class="pp" x="276" y="420">予測（持たせ）</text>
  <text class="pp" x="576" y="150">外し（誤差）</text>
  <text class="pp" x="700" y="392">回収（解決）</text>

  <!-- residue mapping to 目標変容 -->
  <path class="curveMain" stroke-dasharray="1 0" d="M760,300 L800,300" marker-end="url(#arrowTraj)"/>
  <rect class="c-trans" x="800" y="212" width="236" height="150" rx="10"/>
  <text class="transh" x="816" y="238">目標体験軌跡 → 目標変容</text>
  <text class="transb" x="816" y="262">・軌跡は体験の経路、</text>
  <text class="transb" x="830" y="279">　狙うのはその残存＝変容。</text>
  <text class="transb" x="816" y="301">・残ってほしい差分から</text>
  <text class="transb" x="830" y="318">　逆算して経路を置く（二段）。</text>
  <text class="transb" x="816" y="340" fill="#7a5a2a">・目標変容 ≠ 実際の変容</text>
  <text class="transb" x="830" y="356" fill="#7a5a2a">　＝較正の信号。</text>

  <!-- notes row -->
  <rect class="c-prem" x="44" y="480" width="480" height="60" rx="8"/>
  <text class="ann" x="58" y="500" font-weight="700" fill="#2f5e7e">落差駆動と経路依存</text>
  <text class="ann" x="58" y="517" font-size="11.5">軌跡設計の単位は、絶対水準でなく直前状態との落差（差分）。</text>
  <text class="ann" x="58" y="533" font-size="11.5">ゆえに経路依存——到達点が同じでも先行状態が違えば別の体験（順序が効く）。</text>

  <rect class="c-prem" x="540" y="480" width="496" height="60" rx="8"/>
  <text class="ann" x="554" y="500" font-weight="700" fill="#2f5e7e">予測配置＝予測誤差の動的な役（接合の候補・要検証）</text>
  <text class="ann" x="554" y="517" font-size="11.5">軌跡は時間の中で誤差を作り・外し・回収する。距離の静的な役</text>
  <text class="ann" x="554" y="533" font-size="11.5">（前提のずれ）と同一量である保証はまだ無い。多軸は対位で置ける。</text>

  <!-- Ethics band -->
  <rect class="c-eth" x="44" y="556" width="992" height="46" rx="8"/>
  <text class="ann" x="60" y="577" font-size="12.5" font-weight="700" fill="#7a5a3a">倫理＝操作構造の境界（四成分に共通・不可分）</text>
  <text class="ann" x="60" y="594" font-size="11.5">予測配置＝作為の時間設計ゆえ本成分で特に重い。開示された誘導＝招待／隠して自己選択を奪う誘導＝操作。透明性・自己選択・賞味期限・自己更新の不可侵。</text>

  <!-- Audit note + credit -->
  <text class="foot" x="44" y="624">接地：予測符号化・能動的推論・認知負荷・音楽の緊張と解放・物語論の予期と解決・記憶の再固定化＝傍証であって証明でない。クオリア発生は哲学的原始項。設計・監査用（生成非注入）。</text>
  <text class="footR" x="1036" y="644">© 2026 shisaku ／ CC BY 4.0</text>
</svg>
